name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      python-tag: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name || '' }}
      vscode-tag: ${{ steps.release.outputs['extension--release_created'] == 'true' && steps.release.outputs['extension--tag_name'] || '' }}
    steps:
      - uses: actions/checkout@v4

      # Release Please parses a merged grouped PR's body to discover each release.
      - name: Restore merged release metadata
        uses: actions/github-script@v7
        with:
          script: |
            const {restoreReleasePrBody} = require('./.github/scripts/format-release-pr-body');
            const targetBranch = context.ref.replace('refs/heads/', '');
            const releaseBranch = `release-please--branches--${targetBranch}`;
            const {data: pullRequests} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            for (const pullRequest of pullRequests) {
              if (
                !pullRequest.merged_at ||
                pullRequest.head.ref !== releaseBranch ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) continue;
              const body = restoreReleasePrBody(pullRequest.body ?? '');
              if (body !== pullRequest.body) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  body,
                });
              }
            }

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Keep release notes visible
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const {formatReleasePrBody} = require('./.github/scripts/format-release-pr-body');
            const targetBranch = context.ref.replace('refs/heads/', '');
            const releaseBranch = `release-please--branches--${targetBranch}`;
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: targetBranch,
              per_page: 100,
            });
            const {data: mergedPullRequests} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pullRequests = [...openPullRequests, ...mergedPullRequests]
              .filter(pullRequest =>
                pullRequest.head.ref === releaseBranch &&
                pullRequest.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              );

            for (const pullRequest of new Map(
              pullRequests.map(pullRequest => [pullRequest.number, pullRequest]),
            ).values()) {
              const body = formatReleasePrBody(pullRequest.body ?? '');
              if (body !== pullRequest.body) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  body,
                });
              }
            }

  release-assets:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.python-tag != '' || needs.release-please.outputs.vscode-tag != '') }}
    uses: ./.github/workflows/release-assets.yml
    permissions:
      contents: write
    with:
      python-tag: ${{ needs.release-please.outputs.python-tag }}
      vscode-tag: ${{ needs.release-please.outputs.vscode-tag }}

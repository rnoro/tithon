name: Bug report
description: Something did not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        In VS Code, **Tithon: Report Issue** fills in your versions and daemon log for you.
        Please write in English.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. Rough steps are fine.
      placeholder: |
        I ran a cell that prints for 30 seconds, closed the window, and reopened it.
        The output printed while the window was closed was missing.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or environment (optional)
      description: >
        Anything you have: an error message, the end of `~/.tithon/daemon.log`,
        or `tithon status` output.
      render: text

[project]
name = "tithon"
version = "0.2.2"
description = "Tithon - The immortal Python REPL that will set you free."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "rnoro", email = "rnoro5122@gmail.com" },
]
keywords = [
    "jupyter",
    "repl",
    "kernel",
    "interactive",
    "persistent",
    "vscode",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
dependencies = [
    "jupyter_client>=8",
    "ipykernel>=6",
    "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/rnoro/tithon"
Documentation = "https://tithon.readthedocs.io/"
Repository = "https://github.com/rnoro/tithon"
"Bug Tracker" = "https://github.com/rnoro/tithon/issues"
"Discussions" = "https://github.com/rnoro/tithon/discussions"
Changelog = "https://github.com/rnoro/tithon/blob/main/CHANGELOG.md"

[project.scripts]
tithon = "tithon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tithon"]

# Dev dependencies (PEP 735). `uv sync` installs this group by default. These are
# what you need to develop and run the verification scripts: matplotlib / tqdm /
# ipywidgets are runtime deps of the verify suite (matplotlib inline figures,
# terminal tqdm, and tqdm.notebook widget comms), not just the unit tests.
[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib",
    "tqdm",
    "ipywidgets",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["test"]

# Formatting / linting. `line-length = 100` is measured, not defaulted: at the
# stock 88 about 90 existing lines reflow, at 100 only four do, so this is the
# width the code was already written to. The TS side (extension/biome.json) is
# pinned to the same number so a reader moving between the two halves of the
# repo does not re-learn where the margin is.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "scripts/corpus"]

[tool.ruff.lint]
# E/F are pyflakes+pycodestyle, I sorts imports, UP modernizes for py311,
# B catches real bugs (mutable defaults, loop-variable capture). Anything
# beyond this starts rewriting working code for taste.
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line width. E501 only ever fires on what the formatter
# cannot split — a long string literal or a comment — so leaving it on turns
# every such line into a permanent lint error nobody can clear.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test bodies deliberately shadow and re-bind for readability.
"test/**" = ["B011"]